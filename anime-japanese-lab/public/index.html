<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Japanese Lab</title><style>:root{--bg:#f6f7f9;--line:#e7e8ed;--muted:#7b808b;--accent:#635bff;--soft:#f0efff;--text:#17191d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;font-weight:800}.logo{width:35px;height:35px;border-radius:10px;background:linear-gradient(135deg,#5f5af6,#8178ff);display:grid;place-items:center;color:#fff}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.main{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;padding:14px;min-height:0;flex:1}.panel{min-width:0;min-height:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 30px #20232a08}.head{height:62px;flex:none;border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;justify-content:space-between}.title{font-size:14px;font-weight:760}.desc{font-size:11px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45}.urlbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}.urlbar input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;outline:none}.urlbar input:focus{border-color:#aaa6ff;box-shadow:0 0 0 3px #635bff12}.videoBox{position:relative;flex:1;min-height:0;background:#101116}.videoBox iframe{width:100%;height:100%;border:0}.empty{position:absolute;inset:0;display:grid;place-items:center;background:#101116}.drop{width:84%;max-width:460px;text-align:center;border:1px dashed #4d5059;border-radius:15px;background:#17181e;padding:42px 20px;color:#fff}.dropIcon{margin:auto;width:48px;height:48px;border-radius:14px;background:#262831;display:grid;place-items:center;color:#aaa6ff;font-weight:800}.drop h3{font-size:15px;margin:14px 0 5px}.drop p{font-size:11px;color:#9296a0;margin:0}.drop button{margin-top:17px}.hint{border-top:1px solid var(--line);padding:9px 14px;text-align:center;color:var(--muted);font-size:10px}.analysis{overflow:auto;min-height:0}.inner{padding:14px}.status{border:1px solid #e5e3ff;background:#f8f7ff;border-radius:11px;padding:10px 12px;font-size:11px;color:#565b68}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#20a56a;margin-right:8px}.sentence{border:1px solid var(--line);border-radius:13px;margin:12px 0;overflow:hidden}.sHead{padding:9px 12px;background:#fbfbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.num{font-size:10px;font-weight:800;color:#5752c8;background:var(--soft);padding:4px 7px;border-radius:5px}.stamp{font-size:10px;color:#969aa4}.jp{padding:12px 13px 2px;font-size:20px;font-weight:760;line-height:1.7}.jp .kana{font-size:11px;color:#625de5;font-weight:600}.cn{padding:0 13px 12px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.cell{padding:11px 13px}.cell+.cell{border-left:1px solid var(--line)}.label{font-size:10px;font-weight:800;letter-spacing:.4px;color:#969aa3;margin-bottom:7px}.word{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0;font-size:12px}.word strong{font-size:13px}.kana{color:#625de5}.meaning{font-size:11px;color:#555a64}.grammar{border-top:1px solid var(--line);background:#fcfcff;padding:11px 13px}.grammar .label{color:#625de5}.grammar p{font-size:11px;line-height:1.7;color:#4e535d;margin:0}.emptyResults{text-align:center;padding:55px 20px;color:var(--muted);font-size:11px;line-height:1.7}.emptyResults b{display:block;color:#333;font-size:14px;margin-bottom:5px}@media(max-width:920px){.app{height:auto;min-height:100vh;overflow:visible}.main{grid-template-columns:1fr}.panel{height:620px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">日</div><div>Anime Japanese Lab<small>WATCH · LISTEN · UNDERSTAND</small></div></div><button id="clear" class="btn">清空</button></header><main class="main"><section class="panel"><div class="head"><div><div class="title">视频学习</div><div class="desc">粘贴 B 站视频链接</div></div><button id="openBili" class="btn">打开 B 站</button></div><div class="urlbar"><input id="url" value="https://www.bilibili.com/video/BV1sm736QEPf/" placeholder="粘贴 B 站视频链接"><button id="load" class="btn primary">加载视频</button></div><div class="videoBox"><iframe id="player" allow="autoplay; fullscreen; picture-in-picture" scrolling="no" allowfullscreen></iframe><div class="empty" id="empty"><div class="drop"><div class="dropIcon">B</div><h3>粘贴 B 站链接开始学习</h3><p>支持 bilibili.com/video/BV... 链接</p><button id="start" class="btn primary">加载示例视频</button></div></div></div><div class="hint">视频由 B 站官方站外播放器承载；点击「开始分析」后由服务端读取可用媒体/字幕并交给 AI。</div></section><section class="panel"><div class="head"><div><div class="title">AI 日语解析</div><div class="desc">日文 · 中文 · 语法 · 单词 · 50音</div></div><button id="analyze" class="btn primary">✦ 开始分析</button></div><div class="analysis"><div class="inner"><div class="status"><span class="dot"></span><span id="status">等待加载 B 站视频。</span></div><div id="results"><div class="emptyResults"><b>还没有分析内容</b>先加载左侧 B 站视频，再点击「开始分析」。</div></div></div></div></section></main></div><script>const $=id=>document.getElementById(id);const url=$('url'),player=$('player'),empty=$('empty'),status=$('status'),results=$('results');let bvid='';function getBvid(v){return (v.match(/BV[0-9A-Za-z]{10}/)||[])[0]}function load(){bvid=getBvid(url.value.trim());if(!bvid){status.textContent='请输入有效的 B 站 BV 链接。';return}player.src='https://player.bilibili.com/player.html?bvid='+bvid+'&page=1&autoplay=0&danmaku=0&poster=1';empty.style.display='none';status.textContent='视频已加载，可以开始 AI 分析。'}$('load').onclick=load;$('start').onclick=load;$('openBili').onclick=()=>window.open('https://www.bilibili.com/video/'+bvid,'_blank');$('clear').onclick=()=>{player.src='';url.value='';bvid='';empty.style.display='grid';status.textContent='等待加载 B 站视频。';results.innerHTML='<div class="emptyResults"><b>还没有分析内容</b>先加载左侧 B 站视频，再点击「开始分析」。</div>'};function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(s){s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(rows){results.innerHTML=rows.map((x,i)=>'<article class="sentence"><div class="sHead"><span class="num">SENTENCE '+String(i+1).padStart(2,'0')+'</span><span class="stamp">'+fmt(x.start)+' – '+fmt(x.end)+'</span></div><div class="jp">'+esc(x.text)+'<div class="kana">'+esc(x.kana||'')+'</div></div><div class="cn">'+esc(x.translation||'')+'</div><div class="grid"><div class="cell"><div class="label">单词解释</div>'+(x.words||[]).map(w=>'<div class="word"><strong>'+esc(w.surface)+'</strong><span class="kana">'+esc(w.reading)+'</span><span class="meaning">'+esc(w.meaning)+'</span></div>').join('')+'</div><div class="cell"><div class="label">50音 / 读音</div><div class="meaning">'+esc(x.kana||'')+'</div></div></div><div class="grammar"><div class="label">语法讲解</div><p>'+esc(x.grammar||'暂无')+'</p></div></article>').join('')}$('analyze').onclick=async()=>{if(!bvid){status.textContent='请先加载 B 站视频。';return}$('analyze').disabled=true;status.textContent='正在读取 B 站视频并进行 AI 分析……';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:url.value,bvid})});const j=await r.json();if(!r.ok)throw Error(j.error||'分析失败');render(j.sentences||[]);status.textContent='分析完成 · '+(j.sentences||[]).length+' 个句子'}catch(e){status.textContent='分析失败：'+e.message}finally{$('analyze').disabled=false}};load();</script></body></html>
